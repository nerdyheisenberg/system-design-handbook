# nginx as a reverse proxy and load balancer. See Chapters 5 and 11.

user  nginx;
# One worker per core. Each is single-threaded and event-driven, so more than
# one per core just adds context switching.
worker_processes auto;

# ⚠️ The default of 1024 is the most common nginx bottleneck. Max concurrent
# connections is worker_processes x worker_connections, and it must also fit
# within the process file-descriptor limit.
worker_rlimit_nofile 65535;

events {
    worker_connections 16384;
    multi_accept on;
}

http {
    # ---------- logging ----------
    # ⭐ $upstream_response_time and $request_time are the two fields that make
    # this log useful: their difference tells you whether latency came from the
    # backend or from the client's network.
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    'rt=$request_time uct=$upstream_connect_time '
                    'urt=$upstream_response_time '
                    'req_id=$request_id';
    access_log /var/log/nginx/access.log main buffer=32k flush=5s;

    # ---------- performance ----------
    sendfile on;        # copy files to the socket in the kernel, no userspace round trip
    tcp_nopush on;      # batch headers with the start of the body into one packet
    tcp_nodelay on;     # disable Nagle for already-buffered responses

    # ⚠️ keepalive_timeout must be LONGER at the load balancer than at the
    # backend, or the backend closes a connection just as nginx sends a request
    # on it, producing sporadic 502s that are very hard to reproduce.
    keepalive_timeout 75s;
    keepalive_requests 1000;

    server_tokens off; # do not advertise the version in headers or error pages

    # ---------- upstream ----------
    upstream app_backend {
        # least_conn adapts to uneven request cost, which round-robin cannot.
        # ⚠️ It also routes traffic TOWARD a node that is failing fast, since
        # fast errors mean few open connections. Pair it with health checks.
        least_conn;

        server app-1:8080 max_fails=3 fail_timeout=10s;
        server app-2:8080 max_fails=3 fail_timeout=10s;
        server app-3:8080 max_fails=3 fail_timeout=10s;
        server app-4:8080 backup;

        # ⭐ Reuse upstream connections. Without this every proxied request pays
        # a fresh TCP handshake to the backend — often the single largest
        # latency win available from the proxy.
        keepalive 64;
        keepalive_requests 1000;
        keepalive_timeout 60s;
    }

    # ---------- rate limiting ----------
    # binary_remote_addr is used because it is compact: 1 MB holds ~16,000 IPs.
    limit_req_zone $binary_remote_addr zone=general:10m rate=100r/s;
    limit_req_zone $binary_remote_addr zone=login:10m   rate=5r/m;
    limit_conn_zone $binary_remote_addr zone=perip:10m;

    # ---------- caching ----------
    proxy_cache_path /var/cache/nginx
                     levels=1:2
                     keys_zone=api_cache:100m
                     max_size=10g
                     inactive=60m
                     use_temp_path=off;

    server {
        listen 80;
        server_name _;

        # Propagate a request ID so a single request can be traced across
        # every service that handles it.
        proxy_set_header X-Request-ID $request_id;
        add_header X-Request-ID $request_id always;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Required for upstream keepalive to work at all.
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # ⚠️ Timeouts must be bounded. The default read timeout of 60s means a
        # hung backend holds an nginx worker slot for a full minute.
        proxy_connect_timeout 2s;
        proxy_send_timeout    10s;
        proxy_read_timeout    10s;

        # Retry the next upstream only on conditions where the request was
        # certainly not processed.
        # ⚠️ `non_idempotent` is deliberately absent: retrying a POST that may
        # have been processed can duplicate a payment.
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        proxy_next_upstream_timeout 5s;

        gzip on;
        gzip_types application/json application/javascript text/css text/plain;
        gzip_min_length 1024;  # below this, compression costs more than it saves

        location = /healthz {
            access_log off;
            return 200 "ok\n";
        }

        location /api/ {
            limit_req zone=general burst=200 nodelay;
            limit_conn perip 50;
            proxy_pass http://app_backend;
        }

        # Auth endpoints get a far tighter limit, because this is where
        # credential stuffing happens.
        # ⚠️ Per-IP alone is insufficient — attackers rotate IPs. Rate limit per
        # ACCOUNT as well, in the application.
        location = /api/login {
            limit_req zone=login burst=3 nodelay;
            proxy_pass http://app_backend;
        }

        location /static/ {
            proxy_cache api_cache;
            proxy_cache_valid 200 301 302 10m;
            proxy_cache_valid 404 1m;   # negative caching: absent keys otherwise hit the origin every time

            # ⭐ Collapse concurrent misses for the same key into one upstream
            # request. This is cache-stampede protection at the proxy.
            proxy_cache_lock on;
            proxy_cache_lock_timeout 5s;

            # ⭐ Serve stale content while revalidating, and while the origin is
            # down. This converts an origin outage into slightly stale content
            # rather than a 502.
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_background_update on;

            add_header X-Cache-Status $upstream_cache_status always;
            proxy_pass http://app_backend;
        }

        # Server-sent events and streaming responses must not be buffered, or
        # nginx holds the whole response before forwarding any of it.
        location /api/stream {
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            proxy_pass http://app_backend;
        }
    }
}
