# Postgres tuning for a machine with 16 GB RAM and NVMe storage.
# See Chapters 6 and 7.
#
# ⚠️ These are starting points derived from the memory and disk profile, not
# universal truths. Measure before and after; the only way to know whether a
# setting helped is to look at the workload.

# ---------- memory ----------

# 25% of system RAM is the conventional starting point. Postgres relies on the
# OS page cache too, so allocating most of RAM here is counter-productive —
# you end up with the same pages cached twice.
shared_buffers = 4GB

# An estimate of shared_buffers + OS page cache. It does NOT allocate anything;
# it only tells the planner how much caching to assume, which changes whether it
# picks an index scan or a sequential scan.
effective_cache_size = 12GB

# Per sort/hash operation, and a query can use several at once, per connection.
# ⚠️ The real bound is roughly work_mem x max_connections x operations, so raising
# this aggressively with a large connection count invites OOM.
work_mem = 32MB

# Used by VACUUM, CREATE INDEX and ALTER TABLE. Much larger is safe because few
# run concurrently.
maintenance_work_mem = 512MB

# ---------- connections ----------

# ⚠️ Postgres forks a process per connection, each costing several MB. Going much
# above a few hundred degrades throughput through context switching alone.
# The correct fix for "we need 5,000 connections" is a pooler (PgBouncer in
# transaction mode), not a higher number here.
max_connections = 200

# ---------- write-ahead log and durability ----------

# replica retains enough information for streaming replication and PITR.
wal_level = replica

# Larger WAL between checkpoints means fewer, larger checkpoints — less write
# amplification, at the cost of longer crash recovery.
max_wal_size = 4GB
min_wal_size = 1GB

# Spread checkpoint I/O over 90% of the interval instead of dumping it at once.
# ⚠️ Without this you see periodic latency spikes that correlate with nothing in
# the application.
checkpoint_completion_target = 0.9

# synchronous_commit = on is the safe default: a commit is not acknowledged until
# the WAL is flushed.
# ⚠️ Setting it to 'off' makes writes much faster and risks losing the last few
# hundred milliseconds of committed transactions on a crash. That is acceptable
# for analytics ingestion and never acceptable for payments.
synchronous_commit = on

# ---------- planner cost model ----------

# The default of 4.0 assumes spinning disks where random I/O is 4x sequential.
# ⚠️ On SSD/NVMe that ratio is closer to 1.1, and leaving it at 4.0 makes the
# planner avoid index scans it should be using. This is one of the highest-value
# single-line changes on modern hardware.
random_page_cost = 1.1
effective_io_concurrency = 200

# ---------- autovacuum ----------

# Dead tuples accumulate under MVCC and must be reclaimed. The defaults are too
# conservative for busy tables.
autovacuum = on
autovacuum_max_workers = 4
autovacuum_naptime = 15s
# Vacuum when 5% of a table is dead rather than the 20% default.
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.02
# 0 removes the artificial I/O throttle. On SSDs the default delay makes
# autovacuum fall permanently behind on a high-churn table.
autovacuum_vacuum_cost_delay = 0

# ---------- observability ----------

# ⭐ pg_stat_statements is the single most useful extension for finding slow
# queries. It aggregates by normalised query text, so it surfaces the query
# that is slow *in aggregate* rather than the one that was slow once.
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.max = 10000
pg_stat_statements.track = all

# Log anything slower than a second, plus every lock wait and every temp file —
# temp files mean work_mem was exceeded and the sort spilled to disk.
log_min_duration_statement = 1000
log_lock_waits = on
log_temp_files = 0
log_checkpoints = on
log_autovacuum_min_duration = 0

# ⚠️ Bound how long a transaction can sit idle holding a snapshot. A forgotten
# open transaction blocks the vacuum horizon for the entire database, so dead
# tuples accumulate everywhere — not just in the tables it touched.
idle_in_transaction_session_timeout = 60s
statement_timeout = 30s
lock_timeout = 10s
