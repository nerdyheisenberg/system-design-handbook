# Prometheus scrape configuration. See Chapter 19.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: production
    region: eu-west-1

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: order-api
    static_configs:
      - targets: ["app:9090"]
    metric_relabel_configs:
      # ⚠️ CARDINALITY CONTROL. Every distinct label combination is a separate
      # time series. One unbounded label — user_id, request_id, an
      # unnormalised URL path — multiplies series by millions and OOMs the
      # ingest tier. Drop offenders at scrape time, before they are stored.
      - source_labels: [__name__]
        regex: "http_requests_total"
        target_label: user_id
        replacement: ""
        action: replace
      - regex: "^(user_id|request_id|session_id|trace_id)$"
        action: labeldrop

  - job_name: kubernetes-pods
    kubernetes_sd_configs:
      - role: pod
    relabel_configs:
      # Opt in per pod via annotations rather than scraping everything.
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        action: keep
        regex: "true"
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
        action: replace
        target_label: __metrics_path__
        regex: (.+)
      - source_labels:
          [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
        action: replace
        target_label: __address__
        regex: ([^:]+)(?::\d+)?;(\d+)
        replacement: $1:$2
      - source_labels: [__meta_kubernetes_namespace]
        target_label: namespace
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
      - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
        target_label: app
