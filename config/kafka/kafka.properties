# Kafka broker, producer and consumer configuration. See Chapter 12.
#
# The settings below are the ones that actually decide durability, ordering and
# throughput. Everything else is tuning.

# =============================================================================
# BROKER
# =============================================================================

# --- durability ---

# ⭐ Three replicas: tolerates one broker loss while still satisfying
# min.insync.replicas=2. With RF=2 and min.insync=2, ANY broker loss stops
# writes — a common and painful misconfiguration.
default.replication.factor=3
min.insync.replicas=2

# ⚠️ THE most consequential broker setting. When true, a replica that is not
# in-sync may become leader — which means silently discarding acknowledged
# writes in exchange for availability. Default is false; keep it false unless
# you have explicitly decided that losing committed data is preferable to
# unavailability.
unclean.leader.election.enable=false

# ⚠️ Auto-creation turns a typo in a topic name into a new topic with default
# (unsafe) settings, discovered weeks later.
auto.create.topics.enable=false

# --- retention ---
# Kafka is a log, not a queue: messages are retained for a fixed period and
# consumers track their own offset. This is what makes replay possible.
log.retention.hours=168
log.retention.bytes=-1
log.segment.bytes=1073741824

# --- performance ---
num.network.threads=8
num.io.threads=16
num.replica.fetchers=4
socket.send.buffer.bytes=1048576
socket.receive.buffer.bytes=1048576

# ⚠️ Do NOT set log.flush.interval.messages to force fsync per message. Kafka's
# durability comes from REPLICATION, not from fsync — that is a deliberate
# design decision. Forcing synchronous flushes destroys throughput and buys
# very little.

# =============================================================================
# PRODUCER
# =============================================================================

# ⭐ acks=all is the only setting that gives durability. It waits for
# min.insync.replicas to acknowledge.
#   acks=0  fire and forget — data loss on any failure
#   acks=1  leader only — data loss if the leader dies before replication
#   acks=all durable
acks=all

# With idempotence enabled, retries cannot produce duplicates or reorder
# messages, because the broker deduplicates on a producer sequence number.
# ⚠️ Without it, retries can reorder: message 2 succeeds while message 1 is
# being retried.
enable.idempotence=true
max.in.flight.requests.per.connection=5
retries=2147483647
delivery.timeout.ms=120000

# Batching is where producer throughput comes from. linger.ms deliberately waits
# to accumulate a batch — 5ms of added latency for a large multiple in
# throughput. linger.ms=0 (the default) sends single-message batches.
batch.size=65536
linger.ms=5
compression.type=zstd
buffer.memory=67108864

# =============================================================================
# CONSUMER
# =============================================================================

group.id=order-processor

# ⚠️ enable.auto.commit=true commits offsets on a timer, INCLUDING for messages
# you have not finished processing. A crash then skips them — silent message
# loss. Commit manually, after the work is done.
enable.auto.commit=false

# earliest: a new consumer group reads the whole retained log.
# latest: it starts from now, silently skipping everything already there.
auto.offset.reset=earliest

# ⚠️ THE most common cause of "our consumers keep rebalancing". If processing a
# batch takes longer than max.poll.interval.ms, the broker assumes the consumer
# is dead and rebalances — which is a stop-the-world pause for the whole group,
# and looks exactly like an outage. Either raise this or lower max.poll.records.
max.poll.interval.ms=300000
max.poll.records=500

# session.timeout.ms is failure detection; heartbeats are sent on a background
# thread, so this is independent of processing time. Keep heartbeat interval at
# roughly a third of the session timeout.
session.timeout.ms=45000
heartbeat.interval.ms=3000

fetch.min.bytes=1
fetch.max.wait.ms=500

# ⭐ Cooperative rebalancing (incremental) does not stop every consumer in the
# group on every membership change — only the affected partitions move. On a
# large group this is the difference between a brief hiccup and a multi-second
# global pause.
partition.assignment.strategy=org.apache.kafka.clients.consumer.CooperativeStickyAssignor

# read_committed hides messages from aborted transactions, which is required for
# exactly-once processing to mean anything.
isolation.level=read_committed

# =============================================================================
# TOPIC CREATION
# =============================================================================
#
# ⚠️ PARTITION COUNT IS EFFECTIVELY PERMANENT. Adding partitions later changes
# the hash-to-partition mapping, so a given key stops landing on the partition
# that holds its history — which breaks per-key ordering and any keyed state.
#
# Partition count sets the maximum consumer parallelism: one partition is read
# by at most one consumer in a group. Extra consumers sit idle.
#
#   kafka-topics.sh --create \
#     --topic orders \
#     --partitions 24 \
#     --replication-factor 3 \
#     --config min.insync.replicas=2 \
#     --config retention.ms=604800000 \
#     --config compression.type=zstd
#
# ⭐ Log compaction retains the LATEST value per key forever, rather than a time
# window. That turns a topic into a replayable snapshot of current state, which
# is what makes it usable as a changelog for rebuilding a cache or a
# materialised view from scratch.
#
#   kafka-topics.sh --create \
#     --topic customer-profiles \
#     --partitions 12 \
#     --replication-factor 3 \
#     --config cleanup.policy=compact \
#     --config min.cleanable.dirty.ratio=0.1
